<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Size and check pin-type cycloidal gearboxes for a 5-DOF robot arm: loads, contact stress, pins, bearing life and a design advisor." />
    <title>Cycloidal Gearbox Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2315171B'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='%23F6F5F1' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23D9480F'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply a saved theme before first paint to avoid a flash. Storage may throw: ignore.
      try {
        var s = JSON.parse(localStorage.getItem('cgd.session.v1') || 'null');
        if (s && (s.theme === 'light' || s.theme === 'dark')) document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
